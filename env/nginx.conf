user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Expose server version (intentional — vulnerable target)
    server_tokens on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # stub_status exposed (misconfiguration)
        location /nginx_status {
            stub_status on;
            allow all;
        }

        # Basic rewrite with ?-replacement — triggers CVE-2026-42945 path
        location /r/ {
            rewrite ^/r/(.*)$ /index.html?q=$1 last;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Admin panel (404 by default — for path discovery test)
        location /admin {
            return 403 "Forbidden";
        }

        # Fake .env exposure
        location /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }
    }
}
