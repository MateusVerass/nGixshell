user  nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;

    server {
        listen 80;
        server_name localhost;

        # Deterministic heap layout (same knobs as the DepthFirst Nginx-Rift lab)
        request_pool_size 7920;
        connection_pool_size 4096;
        client_header_buffer_size 2048;

        # ── CVE-2026-42945 trigger ───────────────────────────────────────────
        # Requires: rewrite with a '?' in the replacement, followed by another
        # rewrite/if/set directive, using an unnamed capture ($1).
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://127.0.0.1:19999;
            proxy_connect_timeout 1s;
            proxy_read_timeout 60s;
        }

        # ── Heap-spray target ────────────────────────────────────────────────
        # nginx must read the request body before replying, keeping the
        # attacker-controlled POST body allocated in pool memory.
        location /upload {
            client_body_in_single_buffer on;
            client_body_buffer_size 64k;
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:19999;
            proxy_connect_timeout 1s;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # stub_status exposed (misconfiguration, for the web audit)
        location = /nginx_status {
            stub_status on;
            allow all;
        }

        # Fake .env exposure (for path discovery)
        location = /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }
    }
}
