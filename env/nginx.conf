daemon off;
worker_processes 1;
error_log logs/error.log warn;
pid tmp/nginx.pid;
working_directory tmp;

events { worker_connections 1024; }

http {
    access_log off;
    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;

    upstream backend { server 127.0.0.1:19323; }

    server {
        listen 19322;
        location / { return 200 "backend ok\n"; }
    }

    server {
        listen 19321;

        # Deterministic heap layout (same knobs as the DepthFirst Nginx-Rift lab)
        request_pool_size 7920;
        connection_pool_size 4096;
        client_header_buffer_size 2048;

        # ── CVE-2026-42945 trigger ───────────────────────────────────────────
        # Requires: rewrite with a '?' in the replacement, followed by another
        # rewrite/if/set directive, using an unnamed capture ($1).
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # ── Heap-spray target ────────────────────────────────────────────────
        # nginx buffers the whole POST body here and keeps it alive while the
        # backend sleeps (X-Delay), which is what the exploit sprays into.
        location /spray {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        location / { return 200 "ok\n"; }

        # misconfiguration for the web-audit path discovery
        # (stub_status is intentionally not compiled into this build: adding
        # modules would change the binary layout the exploit relies on)
        location = /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }
    }
}
