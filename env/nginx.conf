user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Expose server version (intentional — vulnerable target)
    server_tokens on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # stub_status exposed (misconfiguration)
        location /nginx_status {
            stub_status on;
            allow all;
        }

        # Basic rewrite with ?-replacement — triggers CVE-2026-42945 path
        location /r/ {
            rewrite ^/r/(.*)$ /index.html?q=$1 last;
        }

        # Exploit spray target: proxy_pass reads the full POST body before
        # forwarding, keeping the body buffer allocated for the spray window.
        # Points to an intentionally unreachable backend so only the body
        # buffering matters; the 502 response is expected.
        location /api/ {
            rewrite ^/api/(.*)$ /index.html?q=$1 last;
        }

        location /upload {
            proxy_pass http://127.0.0.1:19999;
            proxy_connect_timeout 1s;
            client_body_buffer_size 64k;
            client_max_body_size 64k;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Admin panel (404 by default — for path discovery test)
        location /admin {
            return 403 "Forbidden";
        }

        # Fake .env exposure
        location /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }
    }
}
