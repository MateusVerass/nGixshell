services:
  nginx-vuln:
    image: nginx:1.25.3          # within CVE-2026-42945 affected range (< 1.30.1)
    container_name: ngixshell-lab
    ports:
      - "19321:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # setarch -R calls personality(), denied by the default seccomp profile
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
