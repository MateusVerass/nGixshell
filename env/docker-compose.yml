services:
  nginx-vuln:
    build: .
    image: ngixshell-lab
    container_name: ngixshell-lab
    ports:
      - "19321:19321"
    # setarch -R calls personality(), denied by the default seccomp profile
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
